<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escala</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Registrar Escala</h2>
  <form>
    <label>Início da escala:</label>
    <input type="datetime-local"><br>

    <label>Fim da escala:</label>
    <input type="datetime-local"><br>

    <fieldset>
      <legend>Veículos que estará disponível:</legend>
      <label><input type="checkbox" value="ABT"> ABT</label><br>
      <label><input type="checkbox" value="AR"> AR</label><br>
      <label><input type="checkbox" value="UR"> UR</label><br>
    </fieldset><br>

    <button type="submit">Salvar Escala</button>
  </form>
</body>
</html>
