<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acionamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Acionar Veículo</h2>
  <form>
    <label for="veiculo">Veículo:</label>
    <select id="veiculo">
      <option>ABT</option>
      <option>AR</option>
      <option>UR</option>
    </select><br>

    <label for="endereco">Endereço da ocorrência:</label>
    <input type="text" id="endereco"><br>

    <label for="tipo">Tipo de ocorrência:</label>
    <input type="text" id="tipo"><br><br>

    <button type="submit">Acionar</button>
  </form>
</body>
</html>
